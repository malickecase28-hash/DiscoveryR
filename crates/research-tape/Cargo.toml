[package]
name = "research-tape"
version = "0.1.0"
edition = "2021"

[dependencies]
arrow-array = "53"
arrow-schema = "53"
parquet = { version = "53", features = ["arrow"] }
research-contracts = { path = "../research-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "stage2_pilot"
path = "src/bin/stage2_pilot.rs"
