[package]
name = "research-contracts"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
sha2 = "0.10"

[[bin]]
name = "validate_contract"
path = "src/bin/validate_contract.rs"

[[bin]]
name = "generate_schemas"
path = "src/bin/generate_schemas.rs"

[[bin]]
name = "ingest_knowledge"
path = "src/bin/ingest_knowledge.rs"
